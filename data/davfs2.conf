# davfs2 settings for UFLinux Files.
#
# This is a template, not a system config file. davfs2 reads exactly two files,
# /etc/davfs2/davfs2.conf and ~/.davfs2/davfs2.conf, and has no conf.d directory
# and no include directive, so a drop-in installed under /etc/davfs2 would be
# silently ignored. Files copies this to ~/.davfs2/davfs2.conf the first time it
# mounts a WebDAV share and leaves it alone afterwards, which is also the only
# place these particular options are legal: dav_user, dav_group, use_proxy and
# proxy are system-wide-only, everything below may be set per user.
#
# The one setting that is not a performance tweak is ask_auth. mount.davfs asks
# for credentials on the terminal when it cannot find them in the secrets file,
# and Files starts it as a detached process with no controlling tty. Without
# this line a WebDAV mount with a wrong password does not fail, it hangs until
# the read timeout, and the reason looks like a slow server.

# Never prompt; a missing credential must be an error the UI can show.
ask_auth 0

# A file manager opens many files in one directory at once. Without this every
# open() re-PROPFINDs its own file, which is what makes a WebDAV folder feel
# slow to scroll through. One PROPFIND per directory instead.
gui_optimize 1

# davfs2 keeps file metadata in RAM for as long as the mount exists. The budget
# for a mount on a low-end system is small, so let it forget what has not been
# touched. The cost is that locally changed attributes are lost, and a network
# share is not somewhere to keep permissions anyway.
minimize_mem 1

# Files owns the idle unmount, so a stale mount should not keep retrying a
# server that has gone away forever.
retry 30
max_retry 120
read_timeout 30

# Downloads only; uploads stay uncompressed, so this is free on a slow link and
# costs a little CPU on a fast one.
use_compression 1

# No character set conversion: the names on the server are UTF-8 or they are
# somebody else's problem, and guessing wrong mangles them irreversibly.
