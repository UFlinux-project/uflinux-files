[package]
name = "uflinux-files"
description = "UFLinux file manager: GTK4 icon, list and Miller-column views"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "uflinux-files"
path = "src/main.rs"

[features]
default = []
# Render our own layer-shell desktop instead of talking to a renderer claimed by
# uflinux-desktop. Off by default so the common package does not pull in
# gtk4-layer-shell. The window itself is still to be written; the feature exists
# so that the dependency decision is made and checked — see
# docs/desktop-integration.md, "Fallback without a renderer".
desktop-icons = ["dep:gtk4-layer-shell"]

[dependencies]
ufm-core.workspace = true
ufm-vfs.workspace = true
ufm-archive.workspace = true
ufm-mount.workspace = true
ufm-search.workspace = true
ufm-index.workspace = true
ufm-desktop-ipc.workspace = true
# The same thumbnail cache the desktop provider writes, so a picture already
# decoded by one component is not decoded again by the other.
ufm-thumb.workspace = true
gtk.workspace = true
gio.workspace = true
glib.workspace = true
# Decode only, on the main thread: a worker hands back encoded PNG because
# `Pixbuf` is neither `Send` nor `Sync`. Already in the graph through gtk4.
gdk-pixbuf.workspace = true
# `pipe2`, `write` and `close` for the listing queue, which cannot use a GLib
# channel because glib 0.21 has none.
libc.workspace = true
# Percent-encoding for the connect dialog, which builds an address for
# `Share::parse` and so has to escape what that parser will decode.
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
gtk4-layer-shell = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
